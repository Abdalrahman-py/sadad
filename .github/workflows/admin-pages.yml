name: Admin dashboard checks and GitHub Pages deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/public/**'
      - 'contract/**'
      - 'tools/check.sh'
      - '.github/workflows/admin-pages.yml'
  pull_request:
    paths:
      - 'server/public/**'
      - 'contract/**'
      - 'tools/check.sh'
      - '.github/workflows/admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck, lint, unit tests, build and Playwright smoke
        run: ./tools/check.sh dashboard
  deploy:
    needs: checks
    # Publishing is a human step (run this workflow by hand): a push to main only checks, so the
    # live site never switches backends on a merge (docs/adr/003-dashboard-hosting.md). Publish from
    # the project repository only; any other fork stays quiet.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Abdalrahman-py/sadad'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Enable Pages on first run instead of requiring a manual repository setting. If the
          # workflow token is not allowed to create the site, this step fails with the same
          # "repository has Pages enabled" error and an owner must enable it by hand.
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard assets
        working-directory: server/public
        run: npm ci --no-audit --no-fund && npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
