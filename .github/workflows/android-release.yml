name: Publish production Android APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/android-ci.yml

  release:
    needs: checks
    if: github.repository == 'Abdalrahman-py/sadad'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set signing key path
        run: echo "SADAD_KEYSTORE_FILE=$RUNNER_TEMP/sadad-release.jks" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # The app orders updates by versionCode alone. Until now every release carried the default 40,
      # so no build could tell which release was newer. The tag decides it now.
      - name: Derive the version code from the tag
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#v}"
          for part in "$major" "$minor" "$patch"; do
            [[ "$part" =~ ^[0-9]+$ ]] || { echo "::error::Tag $GITHUB_REF_NAME must be vMAJOR.MINOR.PATCH"; exit 1; }
          done
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "SADAD_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Sadad ${GITHUB_REF_NAME#v} is versionCode $code"
      - name: Install release verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Require production signing credentials
        env:
          SADAD_KEYSTORE_BASE64: ${{ secrets.SADAD_KEYSTORE_BASE64 }}
          SADAD_KEYSTORE_PASSWORD: ${{ secrets.SADAD_KEYSTORE_PASSWORD }}
          SADAD_KEY_ALIAS: ${{ secrets.SADAD_KEY_ALIAS }}
          SADAD_KEY_PASSWORD: ${{ secrets.SADAD_KEY_PASSWORD }}
        run: |
          for name in SADAD_KEYSTORE_BASE64 SADAD_KEYSTORE_PASSWORD SADAD_KEY_ALIAS SADAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Use a tag such as v3.0.0'; exit 1; }
          umask 077
          printf '%s' "$SADAD_KEYSTORE_BASE64" | base64 --decode > "$SADAD_KEYSTORE_FILE"
      - name: Build signed release
        env:
          SADAD_KEYSTORE_PASSWORD: ${{ secrets.SADAD_KEYSTORE_PASSWORD }}
          SADAD_KEY_ALIAS: ${{ secrets.SADAD_KEY_ALIAS }}
          SADAD_KEY_PASSWORD: ${{ secrets.SADAD_KEY_PASSWORD }}
          SADAD_SENTRY_DSN: ${{ secrets.SADAD_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          # No testReleaseUnitTest here on purpose: the Compose test rules launch
          # androidx.activity.ComponentActivity, and that activity reaches the merged manifest only
          # through ui-test-manifest, which is debug-only precisely so it does not ship. Running the
          # release variant's unit tests therefore cannot host a Compose test (116 of 532 fail with
          # "Unable to resolve activity"), and adding the artifact to release would put a test
          # activity in the production APK. The logic is covered by the `checks` job, which runs the
          # whole suite on debug on this same commit; what this job verifies is the artifact itself
          # (signature, badging, mapping, size, Baseline Profile).
          ./gradlew assembleRelease --console=plain -PSADAD_SENTRY_DSN="$SADAD_SENTRY_DSN" -PSADAD_VERSION_CODE="$SADAD_VERSION_CODE"
      - name: Fail when R8 reports missing classes
        run: |
          missing=app/build/outputs/mapping/release/missing_rules.txt
          [[ -f "$missing" ]] || { echo "::error::$missing not found; AGP moved it, so this gate checks nothing"; exit 1; }
          if [[ -s "$missing" ]]; then
            echo "::error::R8 reported missing classes; add a keep rule with a reason in app/proguard-rules.pro"
            cat "$missing"
            exit 1
          fi
      - name: Verify Sentry mapping metadata when crash reporting is enabled
        env:
          SADAD_SENTRY_DSN: ${{ secrets.SADAD_SENTRY_DSN }}
        run: |
          if [[ -n "$SADAD_SENTRY_DSN" ]]; then
            if ! unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep -Fxq 'assets/sentry-debug-meta.properties'; then
              echo '::error::Crash reporting is enabled, but the release APK has no Sentry mapping UUID (assets/sentry-debug-meta.properties).'
              exit 1
            fi
          fi
      - name: Fail when the release APK is over its size budget or has no Baseline Profile
        run: python3 tools/apk_budget.py app/build/outputs/apk/release/app-release.apk
      - name: Verify production APK and create checksum
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apk-signature.txt"; then
            echo '::error::A debug signing key cannot publish a production APK'
            exit 1
          fi
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.sadad.app'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionName='${GITHUB_REF_NAME#v}'" "$RUNNER_TEMP/apk-badging.txt" || { echo '::error::Tag must match versionName in app/build.gradle.kts'; exit 1; }
          grep -q "versionCode='$SADAD_VERSION_CODE'" "$RUNNER_TEMP/apk-badging.txt" || { echo "::error::The APK versionCode is not the one the tag implies ($SADAD_VERSION_CODE)"; exit 1; }
          if grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo '::error::The release APK is debuggable'
            exit 1
          fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/apk-manifest.txt"
          grep -q 'usesCleartextTraffic.*=(type 0x12)0x0' "$RUNNER_TEMP/apk-manifest.txt"
          mkdir -p release
          cp "$apk" "release/Sadad-${GITHUB_REF_NAME#v}-release.apk"
          cd release
          sha256sum ./*.apk > SHA256SUMS
      - name: Write the update manifest
        run: |
          set -euo pipefail
          apk="release/Sadad-${GITHUB_REF_NAME#v}-release.apk"
          sha=$(cut -d' ' -f1 release/SHA256SUMS)
          size=$(stat -c%s "$apk")
          # The installed app reads this from `releases/latest/download/update.json`. It carries the
          # digest and the size, so the app proves the APK it downloaded is the one published here.
          cat > release/update.json <<JSON
          {
            "channel": "stable",
            "versionCode": $SADAD_VERSION_CODE,
            "versionName": "${GITHUB_REF_NAME#v}",
            "apk": "$(basename "$apk")",
            "sha256": "$sha",
            "sizeBytes": $size,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "إصدار ${GITHUB_REF_NAME#v}. التفاصيل في ملاحظات الإصدار على GitHub."
          }
          JSON
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' release/update.json
      - name: Publish APK, checksum and update manifest to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS release/update.json \
            --verify-tag --generate-notes --title "Sadad ${GITHUB_REF_NAME#v}"
      - name: Remove signing key
        if: always()
        run: rm -f "$SADAD_KEYSTORE_FILE"
