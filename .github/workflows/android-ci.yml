name: Android and edge-function checks

# Nothing else in this repository runs these: the app's JVM tests, the two debug
# builds and the edge-function tests were manual before this workflow existed.
# Scope is deliberately narrow — the app's own source and its build, plus the
# Supabase edge functions — so a docs-only change does not spend runner minutes.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'Supabase-Setup/supabase/functions/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'Supabase-Setup/supabase/functions/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK and sets ANDROID_HOME, so the
      # git-ignored local.properties is not needed here.
      - name: JVM unit tests (no device, no emulator)
        run: ./gradlew testServerDebugUnitTest --console=plain

      # This step exists because the first CI run caught a real one: a device set to UTC produced a
      # different createdAt shape ("Z") than a device at +03:00, and only the runner's zone exposed
      # it. Running the suite in a non-UTC zone as well keeps that class of bug visible.
      - name: JVM unit tests under a non-UTC device zone
        run: ./gradlew testServerDebugUnitTest --rerun-tasks --console=plain
        env:
          TZ: Asia/Gaza

      - name: Build both flavors
        run: ./gradlew assembleServerDebug assembleStandaloneDebug --console=plain

      - name: Compile the instrumented tests (they need a device to run)
        run: ./gradlew assembleServerDebugAndroidTest --console=plain

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/test-results/testServerDebugUnitTest/*.xml
          if-no-files-found: warn

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # One `deno test` per function directory, as AGENTS.md specifies.
      - name: Test each edge function
        working-directory: Supabase-Setup/supabase/functions
        run: |
          for dir in sadad-api sadad-auth sadid-ledger; do
            echo "=== $dir ==="
            (cd "$dir" && deno test -A)
          done
