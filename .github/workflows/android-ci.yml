name: Android, admin site and edge-function checks

# On main, app, dashboard, Edge, database, formatting, status page and AGENTS.md changes run checks;
# other docs-only pushes do not. Every pull request runs them.
# Debug builds are checks only; android-release.yml publishes release.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ledger-core/**'
      - 'contract/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'server/public/**'
      - 'tools/check.sh'
      - 'Supabase-Setup/supabase/functions/**'
      - 'Supabase-Setup/supabase/migrations/**'
      - 'Supabase-Setup/scripts/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/admin-pages.yml'
      - 'AGENTS.md'
      - 'docs/CONTINUE_HERE.md'
      - '.editorconfig'
  # Every PR runs, so the required `ci-ok` check always reports (a path-skipped required check
  # stays pending and blocks the merge).
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which check sections this run needs. A pull request runs only the sections its files can affect
  # (tools/check.sh --changed); every other event runs them all. The PR checkout is the merge commit,
  # so depth 2 brings its first parent, the base, which is all `git diff` needs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sections: ${{ steps.pick.outputs.sections }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: pick
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            sections=$(./tools/check.sh --changed HEAD^1 --list)
          else
            sections="docs format dashboard android edge database"
          fi
          echo "sections: $sections"
          echo "sections=$sections" >> "$GITHUB_OUTPUT"

  docs-and-format:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Check docs and code formatting
        run: ./tools/check.sh docs $FORMAT
        env:
          FORMAT: ${{ contains(needs.changes.outputs.sections, 'format') && 'format' || '' }}

  admin-site:
    needs: changes
    if: contains(needs.changes.outputs.sections, 'dashboard')
    # Every job pins ubuntu-24.04: on ubuntu-latest (26.04) Playwright 1.56 cannot install Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check dashboard JavaScript and build deployment assets
        run: ./tools/check.sh dashboard

  android:
    needs: changes
    if: contains(needs.changes.outputs.sections, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The runner image ships the Android SDK and sets ANDROID_HOME, so the
      # git-ignored local.properties is not needed here.
      - name: Run Android tests and builds
        run: ./tools/check.sh android
        env:
          # A pull request builds debug only; the release build and APK budget run when it lands.
          SADAD_SKIP_RELEASE_BUILD: ${{ github.event_name == 'pull_request' }}

      # This step exists because the first CI run caught a real one: a device set to UTC produced a
      # different createdAt shape ("Z") than a device at +03:00, and only the runner's zone exposed
      # it. Running the suite in a non-UTC zone as well keeps that class of bug visible. `--rerun`
      # forces just the two test tasks (it also bypasses the build cache); compile output is reused.
      - name: JVM unit tests under a non-UTC device zone
        run: ./gradlew :ledger-core:test --rerun testDebugUnitTest --rerun --console=plain
        env:
          TZ: Asia/Gaza

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

  edge-functions:
    needs: changes
    if: contains(needs.changes.outputs.sections, 'edge')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Test each edge function
        run: ./tools/check.sh edge

  database:
    needs: changes
    if: contains(needs.changes.outputs.sections, 'database')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test migration and RPC contracts in isolated databases
        run: ./tools/check.sh database

  # The one required status check for merging into main and dev (repository rulesets). A job that
  # `changes` left out is skipped, which counts as passing.
  ci-ok:
    if: always()
    needs: [changes, docs-and-format, admin-site, android, edge-functions, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any check job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "every needed check job succeeded"
