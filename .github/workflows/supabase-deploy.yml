name: Deploy Supabase schema and api

# Manual only. The deploy job waits on the `production` environment, whose required reviewers
# and the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are set by a human in the
# repository settings. Reviewers are asked only after the sections a schema and api deploy depends
# on pass (database, edge). Android, dashboard and docs checks run in android-ci.yml, so a flaky
# app test never blocks a deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the database and edge checks
        run: ./tools/check.sh database edge

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: vhftjmiltqfwmrszdtgf
    defaults:
      run:
        working-directory: Supabase-Setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply schema
        run: supabase db push --linked --yes

      - name: Deploy api
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --use-api --yes
