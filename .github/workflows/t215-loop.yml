name: TEMP ticket 215 ContactDetailViewModelTest x30

# Temporary: proves ticket 215 (30 of 30 on this branch, before count on dev). Removed before merge.

on:
  push:
    branches: [ticket-215]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        ref: [ticket-215, dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref == 'dev' && 'dev' || github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Run ContactDetailViewModelTest 30 times
        run: |
          git log -1 --format='%H %s'
          pass=0; fail=0
          for i in $(seq 1 30); do
            if ./gradlew :app:testDebugUnitTest --tests '*ContactDetailViewModelTest' --rerun --console=plain -q; then
              pass=$((pass+1)); echo "run $i: pass"
            else
              fail=$((fail+1)); echo "run $i: FAIL"
            fi
          done
          echo "${{ matrix.ref }} $(git rev-parse --short HEAD): $pass passed, $fail failed of 30" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $fail == 0 ]]
