name: Ticket scope

# A ticket PR ("Closes #N") may change only the paths its issue lists under "Files you may edit".
# Runs on pull_request_target, so GitHub takes this workflow file from the base branch and a PR
# cannot edit its own check. The job checks out only the default branch and never runs PR code: the
# checker is tools/ticket_files.py from base, and the PR is read through the API. Keep it that way:
# no PR checkout, no ${{ }} of PR text inside a run script.
# A branch named ticket-NN must close the issue titled "NN: ...".
# The repository owner can approve extra paths during review with a PR comment line
# "scope-approved: `path`" (see docs/agents/issue-tracker.md); the job log shows which comment did.
# A branch named ticket-* must close an issue; other PRs (no "Closes #N") pass.

on:
  # Transitional: this file's own PR runs main's old workflow for `pull_request_target`, which has
  # no such trigger, so `scope` would stay pending. Delete `pull_request` once a later PR has shown
  # a `scope` run from `pull_request_target`; until then the gate is no weaker than before.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The default branch, whatever the PR's base: only trusted code runs here.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Changed files must be in the ticket's "Files you may edit"
        shell: bash # -eo pipefail: a failing `gh api` must fail the step, not yield an empty file list
        run: |
          issue=$(gh pr view "$PR" --json body --jq .body | grep -oiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | head -1 | grep -o '[0-9]\+$' || true)
          if [[ -z $issue ]]; then
            [[ $HEAD_REF != ticket-* ]] || { echo "::error::branch $HEAD_REF has no \"Closes #N\" in the PR body"; exit 1; }
            echo "no ticket issue; nothing to check"; exit 0
          fi
          if [[ $HEAD_REF == ticket-* && ! $HEAD_REF =~ ^ticket-[0-9]+$ ]]; then
            echo "::error::branch $HEAD_REF must be named ticket-NN"; exit 1
          fi
          if [[ $HEAD_REF =~ ^ticket-([0-9]+)$ ]]; then
            n=$((10#${BASH_REMATCH[1]}))
            title=$(gh issue view "$issue" --json title --jq .title)
            [[ $title =~ ^0*$n: ]] || { echo "::error::branch $HEAD_REF is ticket $n but closes #$issue (\"$title\")"; exit 1; }
          fi
          gh issue view "$issue" --json body --jq .body > "$RUNNER_TEMP/ticket.md"
          grep -q '^Files you may edit' "$RUNNER_TEMP/ticket.md" || { echo "::error::#$issue has no \"Files you may edit:\" list"; exit 1; }
          # Extra paths the repository owner approved during review: a PR comment line
          # "scope-approved: `path` `path`" and nothing else on the line. Only the owner's comments
          # count, and an edited comment is ignored (post a new one); after commenting, re-run this job.
          gh api --paginate "repos/$GH_REPO/issues/$PR/comments" --jq '.[] | select(.user.login == env.OWNER and .author_association == "OWNER" and .created_at == .updated_at) | .id as $id | .body | split("\n")[] | select(test("^scope-approved: (`[^`]+`\\s*)+$")) | "\($id)\t\(.)"' > "$RUNNER_TEMP/approvals.tsv"
          cut -f2- "$RUNNER_TEMP/approvals.tsv" > "$RUNNER_TEMP/approved.txt"
          if [[ -s $RUNNER_TEMP/approvals.tsv ]]; then echo "owner-approved extra paths (comment id, line):"; cat "$RUNNER_TEMP/approvals.tsv"; fi
          # The files API lists a rename's old path too (`gh pr diff --name-only` lists only the new one).
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if out=$(python3 tools/ticket_files.py scope "$RUNNER_TEMP/ticket.md" --also "$RUNNER_TEMP/approved.txt" < "$RUNNER_TEMP/files.txt"); then
            echo "every changed file is allowed by #$issue"
          else
            echo "::error::files outside #$issue \"Files you may edit\":"; echo "$out"; exit 1
          fi
