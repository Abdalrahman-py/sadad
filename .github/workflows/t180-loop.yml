name: TEMP ticket 180 AutomaticSyncGraphTest x30

# Temporary: red/green counts for ticket 180. Removed before merge.

on:
  push:
    branches: [ticket-180]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Gaza]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Run AutomaticSyncGraphTest 30 times
        run: |
          git log -1 --format='%H %s'
          pass=0; fail=0
          for i in $(seq 1 30); do
            if ./gradlew :app:testDebugUnitTest --tests '*AutomaticSyncGraphTest' --rerun --console=plain -q; then
              pass=$((pass+1)); echo "run $i: pass"
            else
              fail=$((fail+1)); echo "run $i: FAIL"
              python3 - <<'PY'
          import glob, re
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*AutomaticSyncGraphTest.xml'):
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', open(f).read()):
                  print("FAILURE", m.group(1), m.group(2)[:6000])
          PY
            fi
          done
          echo "${{ matrix.tz }} $(git rev-parse --short HEAD): $pass passed, $fail failed of 30" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $fail == 0 ]]
