name: Publish team build

# The `dev` branch is where work lands and gets tried: every push builds the `team` variant (the
# debug app, package `com.sadad.app.debug`, so it installs beside the real one) and replaces the APK on
# the rolling `team-latest` prerelease. `main` stays the stable line: android-release.yml publishes
# the signed production APK from a `v*` tag, and nothing here touches it.
#
# Requires the four TEAM_KEY* secrets: a copy of the key every published team build already carries
# (certificate 8E:72:F9:D4:…), kept in secrets so a runner's per-job debug key never signs a release.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-release
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/android-ci.yml

  team:
    needs: checks
    if: github.repository == 'Abdalrahman-py/sadad'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set signing key path
        run: echo "TEAM_KEYSTORE_FILE=$RUNNER_TEMP/team.jks" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Unpack the signing key
        env:
          TEAM_KEYSTORE_BASE64: ${{ secrets.TEAM_KEYSTORE_BASE64 }}
          TEAM_KEYSTORE_PASSWORD: ${{ secrets.TEAM_KEYSTORE_PASSWORD }}
          TEAM_KEY_ALIAS: ${{ secrets.TEAM_KEY_ALIAS }}
          TEAM_KEY_PASSWORD: ${{ secrets.TEAM_KEY_PASSWORD }}
        run: |
          for name in TEAM_KEYSTORE_BASE64 TEAM_KEYSTORE_PASSWORD TEAM_KEY_ALIAS TEAM_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$TEAM_KEYSTORE_BASE64" | base64 --decode > "$TEAM_KEYSTORE_FILE"
      - name: Build the team APK
        env:
          TEAM_KEYSTORE_PASSWORD: ${{ secrets.TEAM_KEYSTORE_PASSWORD }}
          TEAM_KEY_ALIAS: ${{ secrets.TEAM_KEY_ALIAS }}
          TEAM_KEY_PASSWORD: ${{ secrets.TEAM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "SADAD_TEAM_VERSION=$version" >> "$GITHUB_ENV"
          # The app orders updates by versionCode alone, so it has to be in the environment for the
          # update manifest as well as in the build.
          echo "SADAD_VERSION_CODE=$((40 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          ./gradlew :app:assembleTeam --console=plain \
            -PSADAD_VERSION_NAME="$version" \
            -PSADAD_VERSION_CODE="$((40 + GITHUB_RUN_NUMBER))"
      - name: Refuse an APK that is not the team app
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/team/app-team.apk
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.sadad.app.debug'" "$RUNNER_TEMP/badging.txt" || {
            echo '::error::The team APK must carry the .debug package so it installs beside the real app.'
            exit 1
          }
          # `versionNameSuffix` in app/build.gradle.kts appends `-team`, so check for the full name.
          grep -Fq "versionName='${SADAD_TEAM_VERSION}-team'" "$RUNNER_TEMP/badging.txt" || {
            echo '::error::The team APK has the wrong version name.'
            exit 1
          }
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          if ! grep -qi 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo '::error::The team key must be the one the installed team builds already carry.'
            exit 1
          fi
      - name: Collect the APK and its checksum
        run: |
          set -euo pipefail
          mkdir -p team
          cp app/build/outputs/apk/team/app-team.apk team/Sadad-team.apk
          cd team
          sha256sum ./*.apk > SHA256SUMS
          {
            echo "version: $SADAD_TEAM_VERSION-team"
            echo "commit: $GITHUB_SHA"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > BUILD.txt
      - name: Write the release notes
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 team/SHA256SUMS)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          أحدث بناء من فرع \`dev\` لتجربة الفريق.

          - الإصدار: \`$SADAD_TEAM_VERSION-team\`
          - الالتزام: \`$GITHUB_SHA\`
          - البناء: [هذه التشغيلة]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - sha256: \`$sha\`

          **قبل التثبيت:** هذا بناء تجريبي بحزمة \`com.sadad.app.debug\`، يُثبّت بجانب التطبيق الرسمي ولا يمسّ بياناته، ويظهر بأيقونة «سدد» ثانية. يتصل بمشروع الإنتاج، فاستخدم متجر اختبار. لا تُثبّت فوقه إصدارًا قديمًا: كل بناء يوقّعه المفتاح نفسه، فيُحدَّث من التطبيق مباشرة.
          NOTES
      - name: Write the update manifest
        run: |
          set -euo pipefail
          apk=team/Sadad-team.apk
          sha=$(cut -d' ' -f1 team/SHA256SUMS)
          size=$(stat -c%s "$apk")
          # What the installed app reads to learn there is a newer build: `releases/download/
          # team-latest/update.json`. No GitHub API call, so no rate limit.
          cat > team/update.json <<JSON
          {
            "channel": "team",
            "versionCode": $SADAD_VERSION_CODE,
            "versionName": "$SADAD_TEAM_VERSION-team",
            "apk": "Sadad-team.apk",
            "sha256": "$sha",
            "sizeBytes": $size,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "أحدث بناء من فرع dev: الإصدار $SADAD_TEAM_VERSION-team."
          }
          JSON
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' team/update.json
      - name: Publish to the team prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view team-latest > /dev/null 2>&1; then
            gh release create team-latest --prerelease --target dev \
              --title 'سدد — أحدث بناء للفريق (dev)' \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload team-latest team/Sadad-team.apk team/SHA256SUMS team/BUILD.txt team/update.json --clobber
          gh release edit team-latest --notes-file "$RUNNER_TEMP/notes.md"
      - name: Prove the published manifest is served
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/team-latest/update.json"
          # `releases/download/<tag>/<file>` answers 404 for a release that is there — seen on
          # 26 October 2026 for minutes at a time, on every asset of the release, while the release
          # page, the API and the asset-by-id endpoint all stayed up. A release the app cannot read
          # is a failed publish, so wait for the CDN to agree and fail the run if it never does.
          served=""
          for attempt in $(seq 1 20); do
            body=$(curl -fsSL --max-time 20 "$url" || true)
            served=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("versionCode",""))' 2>/dev/null || true)
            if [ "$served" = "$SADAD_VERSION_CODE" ]; then
              echo "served versionCode $served on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: served '${served}', wanted $SADAD_VERSION_CODE"
            sleep 15
          done
          echo "::error::$url did not serve versionCode $SADAD_VERSION_CODE"
          exit 1
      - name: Remove the signing key
        if: always()
        run: rm -f "$TEAM_KEYSTORE_FILE"
