<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#064B42}a:hover{color:#02302B}
input::placeholder{color:#5B6F63;opacity:1}
input:focus{outline:2px solid #159D89;outline-offset:1px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 18px 32px; display: flex; flex-direction: column; gap: 28px; background: linear-gradient(180deg, #F5F8F3, #EDF6EF); font-family: 'Noto Sans Arabic', Roboto, system-ui, sans-serif; color: #142C24; overflow: hidden">

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<svg width="72" height="72" viewBox="0 0 56.69 56.69" role="img" aria-label="شعار سدد"><path fill="#e6fcf9" d="M5.18,0 H51.51 A5.18,5.18 0 0 1 56.69,5.18 V51.51 A5.18,5.18 0 0 1 51.51,56.69 H5.18 A5.18,5.18 0 0 1 0,51.51 V5.18 A5.18,5.18 0 0 1 5.18,0 Z"/><path fill="#094842" d="m28.37,13.25c-1.25.97-2.28,2.15-3.030,3.46-.53.93-4.550,9.090-5,10.010v.02s-2.510,5.430-2.510,5.430c-2.950,6.380-5.690,9.050-7.800,10.250-1.190.67-2.540,1.020-3.900,1.020h-3.820c-.17,0-.3-.14-.3-.3v-7.740c0-.26.13-.51.35-.67,2.140-1.550,3.520-3.120,5.310-5.970.31-.49.64-.96.9-1.470l3.330-6.420c1.840-3.440,3.180-5.750,6.690-6.980,1.120-.39,2.290-.59,3.470-.63h6.320Z"/><path fill="#1ba892" d="m43.06,13.25s0,0,0,.01c-1.34,1.01-2.46,2.19-3.22,3.41-.94,1.51-4.62,9.2-5.03,10.07l-2.5,5.43c-3.41,7.36-6.52,9.87-9.23,10.84-.78.28-1.61.42-2.45.42h-7.06c-.09,0-.13-.11-.06-.17,0,0,0,0,0,0,2.44-2.1,4.66-5.35,6.79-9.94l2.49-5.4c1.78-3.61,4.54-9.2,4.91-9.85,1.56-2.71,4.8-4.69,7.89-4.82h1.77s.02,0,.03,0h5.68Z"/><path fill="#96ead4" d="m54.69,14.06v7.23c0,.26-.13.51-.34.67-2.14,1.55-3.52,3.12-5.310,5.970-.31.49-.64.96-.9,1.470l-3.330,6.420c-1.840,3.440-3.180,5.750-6.690,6.980-1.250.44-2.580.64-3.910.64h-6.190c-.1,0-.14-.12-.07-.19,0,0,0,0,0,0,2.460-2.1,4.7-5.350,6.820-9.950l2.490-5.4c1.120-2.340,4.150-8.630,4.880-9.8,1.570-2.530,5.190-4.750,7.910-4.860h3.920c.4.05.71.4.71.82Z"/></svg>
<div style="font-size: 26px; line-height: 34px; font-weight: 700; color: #064B42">سدد</div>
<div style="font-size: 15px; line-height: 22px; color: #5B6F63">حسابات واضحة، وسجل مرتب، ومتابعة أسرع</div>
</div>

<form style="background: #FFFFFF; border: 1px solid #D5E5D9; border-radius: 26px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 32px rgba(6,75,66,0.08)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 23px; line-height: 32px; font-weight: 700">تسجيل الدخول</h1>
<p style="margin: 0; font-size: 13px; line-height: 20px; color: #5B6F63">أدخل حساب المتجر الذي أنشأه الأدمن</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="auth-user" style="font-size: 13px; font-weight: 700">اسم المستخدم</label>
<input id="auth-user" dir="auto" autocomplete="username" placeholder="store.owner" value="{{user}}" onChange="{{onUser}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 13px; border: 1px solid #D5E5D9; background: #E7F3ED; font: inherit; font-size: 15px; color: #142C24">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="auth-pass" style="font-size: 13px; font-weight: 700">كلمة المرور</label>
<div style="position: relative">
<input id="auth-pass" dir="auto" autocomplete="current-password" type="{{passType}}" placeholder="••••••••" value="{{pass}}" onChange="{{onPass}}" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 14px 0 52px; border-radius: 13px; border: 1px solid #D5E5D9; background: #E7F3ED; font: inherit; font-size: 15px; color: #142C24">
<button type="button" aria-label="{{eyeLabel}}" onClick="{{toggleShow}}" style="position: absolute; left: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #5B6F63; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{show}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.4 5.2A9.6 9.6 0 0 1 12 5c5 0 9 4.5 10 7a12.6 12.6 0 0 1-3.2 4.2M6.1 6.6C3.9 8 2.5 10.1 2 12c1 2.5 5 7 10 7a9.7 9.7 0 0 0 4.2-.9"/></svg>
</sc-if>
<sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</sc-if>
</button>
</div>
</div>

<a href="Home.dc.html" style="height: 52px; margin-top: 4px; border-radius: 10px; background: #064B42; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
دخول آمن
</a>
</form>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<span style="font-size: 13px; color: #5B6F63">ليس لديك حساب بعد؟</span>
<a href="#support" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-size: 15px; font-weight: 700">تواصل معنا لتفعيل حسابك</a>
<p style="margin: 8px 0 0; max-width: 300px; font-size: 12px; line-height: 19px; color: #5B6F63">يُسجَّل هذا الجهاز بعد الدخول، ويبدأ العمل حين يوافق صاحب المتجر عليه.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { user: '', pass: '', show: false };
}
renderVals() {
const s = this.state;
return {
user: s.user,
pass: s.pass,
show: s.show,
hidden: !s.show,
passType: s.show ? 'text' : 'password',
eyeLabel: s.show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
onUser: (e) => this.setState({ user: e.target.value }),
onPass: (e) => this.setState({ pass: e.target.value }),
toggleShow: () => this.setState({ show: !s.show }),
};
}
}
</script>
</body>
</html>
