<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تغيير كلمة المرور المؤقتة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 18px 28px; display: flex; flex-direction: column; gap: 18px; background: linear-gradient(180deg, #F5F8F3, #EDF6EF); font-family: 'Noto Sans Arabic', Roboto, system-ui, sans-serif; color: #142C24; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #5B6F63">الخطوة 1 من 2 · أول دخول</span>
<h1 style="margin: 0; font-size: 23px; line-height: 32px; font-weight: 700">اختر كلمة مرور خاصة بك</h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #5B6F63">كلمة المرور الحالية مؤقتة من الأدمن. غيّرها مرة واحدة لتتابع.</p>
</div>

<form style="margin: 0; background: #FFFFFF; border: 1px solid #D5E5D9; border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="{{f.id}}" style="font-size: 13px; font-weight: 700">{{f.label}}</label>
<input id="{{f.id}}" dir="ltr" type="{{passType}}" autocomplete="{{f.auto}}" value="{{f.value}}" onChange="{{f.onChange}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 13px; border: 1px solid #D5E5D9; background: #E7F3ED; font: inherit; font-size: 15px; color: #142C24; text-align: right">
</div>
</sc-for>
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer">
<input type="checkbox" checked="{{show}}" onChange="{{toggleShow}}" style="width: 20px; height: 20px; accent-color: #064B42">
إظهار كلمات المرور
</label>
<ul aria-label="شروط كلمة المرور" style="margin: 0; padding: 12px 14px; border-radius: 13px; background: #F5F8F3; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; color: {{r.color}}">
<sc-if value="{{r.ok}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></sc-if>
<sc-if value="{{r.notOk}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg></sc-if>
{{r.label}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.sr}}</span>
</li>
</sc-for>
</ul>
<a href="{{nextHref}}" aria-disabled="{{notReady}}" style="height: 52px; border-radius: 10px; background: {{btnBg}}; color: {{btnFg}}; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">حفظ ومتابعة</a>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cur: 'Temp-2026', next: '', again: '', show: false };
}
renderVals() {
const s = this.state;
// Rules from the API contract: 12 to 128 characters, not the current one.
const rules = [
{ label: 'من 12 إلى 128 حرفًا', ok: s.next.length >= 12 && s.next.length <= 128 },
{ label: 'تختلف عن كلمة المرور المؤقتة', ok: s.next !== '' && s.next !== s.cur },
{ label: 'التأكيد مطابق', ok: s.again !== '' && s.again === s.next },
];
const ready = rules.every((r) => r.ok);
return {
passType: s.show ? 'text' : 'password',
show: s.show,
toggleShow: () => this.setState({ show: !s.show }),
fields: [
{ id: 'pw-cur', label: 'كلمة المرور المؤقتة', auto: 'current-password', value: s.cur, onChange: (e) => this.setState({ cur: e.target.value }) },
{ id: 'pw-new', label: 'كلمة المرور الجديدة', auto: 'new-password', value: s.next, onChange: (e) => this.setState({ next: e.target.value }) },
{ id: 'pw-again', label: 'أعد كتابتها', auto: 'new-password', value: s.again, onChange: (e) => this.setState({ again: e.target.value }) },
],
rules: rules.map((r) => ({ ...r, notOk: !r.ok, color: r.ok ? '#064B42' : '#5B6F63', sr: r.ok ? ' — متحقق' : ' — غير متحقق' })),
notReady: !ready,
nextHref: ready ? 'Approval.dc.html' : '#',
btnBg: ready ? '#064B42' : '#D6EFE4',
btnFg: ready ? '#FFFFFF' : '#5B6F63',
};
}
}
</script>
</body>
</html>
