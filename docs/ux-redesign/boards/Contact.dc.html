<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صفحة الشخص</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="{{vars}} position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg), var(--bg2)); font-family: 'Noto Sans Arabic', Roboto, system-ui, sans-serif; color: var(--text); overflow: hidden">

<header style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; justify-content: space-between">
<a href="People.dc.html" aria-label="رجوع إلى الأشخاص" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--text)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
<button type="button" aria-label="خيارات أخرى" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{menuBtnBg}}; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
</button>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 0 18px 20px; display: flex; flex-direction: column; gap: 16px">

<section style="display: flex; align-items: center; gap: 14px">
<span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: {{p.avatarRadius}}; background: var(--soft); color: var(--link); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700">{{p.initials}}</span>
<div style="min-width: 0; display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 21px; line-height: 30px; font-weight: 700">{{p.name}}</h1>
<span style="font-size: 13px; line-height: 20px; color: var(--muted)">{{p.typeLabel}} · <bdi dir="ltr">{{p.phone}}</bdi></span>
</div>
</section>

<section aria-label="الرصيد" style="border-radius: 18px; padding: 18px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 10px; color: {{p.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="align-self: center"><path d="{{p.arrow}}"/></svg>
<span style="font-size: 23px; font-weight: 700">{{p.word}}</span>
<span dir="ltr" style="font-size: 30px; line-height: 38px; font-weight: 700">{{p.amountText}}</span>
</div>
<span style="font-size: 13px; line-height: 20px; color: var(--muted)">{{p.explain}}</span>
</section>

<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">الحركات</h2>
<span style="font-size: 12px; color: var(--muted)">الرصيد بعد كل حركة</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="7">
<sc-if value="{{it.isHead}}" hint-placeholder-val="{{ false }}">
<div style="padding: 10px 2px 2px; font-size: 13px; font-weight: 700; color: var(--muted)">{{it.label}}</div>
</sc-if>
<sc-if value="{{it.isRow}}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 13px; background: var(--card); border: 1px solid var(--line); overflow: hidden">
<button type="button" aria-expanded="{{it.open}}" onClick="{{it.toggle}}" style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border: 0; background: transparent; color: var(--text); font: inherit; text-align: right; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: {{it.iconBg}}; color: {{it.iconFg}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"/></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; line-height: 22px; font-weight: 700">{{it.title}}</span>
<span style="font-size: 12px; line-height: 18px; color: var(--muted)">{{it.meta}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0">
<span dir="ltr" style="font-size: 15px; line-height: 22px; font-weight: 700; color: {{it.amountColor}}">₪ {{it.amount}}</span>
<span style="font-size: 11px; line-height: 16px; font-weight: 700; color: {{it.afterColor}}">{{it.after}}</span>
</span>
</button>
<sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; line-height: 18px; color: var(--muted)">{{it.who}}</span>
<div style="display: flex; gap: 8px">
<button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--surface); color: var(--link); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{it.fix}}</button>
</div>
</div>
</sc-if>
</div>
</sc-if>
</sc-for>
</section>
</main>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 18px 20px; background: var(--card); box-shadow: 0 -4px 16px rgba(6, 75, 66, 0.10); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="{{p.debtHref}}" style="height: 52px; box-sizing: border-box; border-radius: 13px; border: 1.5px solid var(--owes); background: var(--owesSoft); color: var(--owes); text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
{{p.debtLabel}}
</a>
<sc-if value="{{payOpen}}" hint-placeholder-val="{{ true }}">
<a href="{{p.payHref}}" style="height: 52px; border-radius: 13px; background: var(--primary); color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
{{p.payLabel}}
</a>
</sc-if>
<sc-if value="{{payLocked}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 52px; box-sizing: border-box; padding: 6px 10px; border-radius: 13px; background: var(--surface); color: var(--muted); display: flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<span style="font-size: 12px; line-height: 17px">اطلب من صاحب المتجر تفعيل الدفعات</span>
</div>
</sc-if>
</div>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; top: 56px; left: 12px; width: 236px; box-sizing: border-box; padding: 6px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(2, 48, 43, 0.18); display: flex; flex-direction: column">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
<button type="button" role="menuitem" style="height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: {{m.color}}; font: inherit; font-size: 14px; font-weight: 500; text-align: right; display: flex; align-items: center; gap: 10px; cursor: pointer">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"/></svg>
{{m.label}}
</button>
</sc-for>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["credit","supplier"],"default":"credit"},"paymentsLocked":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 1, menu: false };
}
theme(d) {
const t = d
? { bg: '#102721', bg2: '#142E25', surface: '#1C3931', soft: '#2A4E42', primary: '#256C5A', link: '#78DEC0', text: '#F0F7EF', muted: '#B5CEC0', line: '#375A4B', card: '#1C3931', owes: '#F59A9F', owesSoft: '#583B3D', credit: '#FFD08A', creditSoft: '#4A3A22' }
: { bg: '#F5F8F3', bg2: '#EDF6EF', surface: '#E7F3ED', soft: '#D6EFE4', primary: '#064B42', link: '#064B42', text: '#142C24', muted: '#5B6F63', line: '#D5E5D9', card: '#FFFFFF', owes: '#AB323A', owesSoft: '#FFE1E1', credit: '#9A5A13', creditSoft: '#FFF1DD' };
return Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';') + ';';
}
fmt(n) {
return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
balWord(b) {
if (b > 0) return ['عليه ₪ ' + this.fmt(b), 'var(--owes)'];
if (b < 0) return ['له ₪ ' + this.fmt(b), 'var(--credit)'];
return ['مسدد', 'var(--muted)'];
}
renderVals() {
const supplier = (this.props.who ?? 'credit') === 'supplier';
const PLUS = 'M12 5v14M5 12h14';
const DOWN = 'M12 4v11M7 10l5 5 5-5';
const p = supplier
? { name: 'مخبز الأمل', initials: 'مأ', phone: '0592 300 208', typeLabel: 'مورد', avatarRadius: '14px', bal: -1240, debtLabel: 'بضاعة بالدين', payLabel: 'دفع للمورد', explain: 'ما عليك لهذا المورد. يقل حين تدفع له.' }
: { name: 'أحمد ناصر', initials: 'أن', phone: '0597 220 331', typeLabel: 'زبون', avatarRadius: '28px', bal: -150, debtLabel: 'دين جديد', payLabel: 'استلام دفعة', explain: 'رصيد لصالحه من دفعة زائدة، يُخصم تلقائيًا من مشترياته القادمة.' };
const w = p.bal > 0 ? ['عليه', 'var(--owes)', 'M12 19V5M5 12l7-7 7 7'] : (p.bal < 0 ? ['له', 'var(--credit)', 'M12 5v14M5 12l7 7 7-7'] : ['مسدد', 'var(--muted)', 'M5 12.5l4.5 4.5L19 7']);
const raw = supplier
? [
{ head: 'أكتوبر 2026' },
{ debt: true, title: 'بضاعة بالدين', meta: '22 أكتوبر · خبز يومي', amount: 940, after: -1240, who: 'سجّلها سامر · جهاز الكاشير · 7:40 ص' },
{ debt: false, title: 'دفع للمورد · نقدي', meta: '15 أكتوبر', amount: 600, after: -300, who: 'سجّلها صاحب المتجر · هاتف المالك · 6:10 م' },
{ debt: true, title: 'بضاعة بالدين', meta: '1 أكتوبر · خبز وكعك', amount: 900, after: -900, who: 'سجّلها سامر · جهاز الكاشير · 7:35 ص' },
]
: [
{ head: 'أكتوبر 2026' },
{ debt: true, title: 'دين · خُصم من رصيده', meta: '20 أكتوبر · خبز وحليب', amount: 100, after: -150, who: 'سجّلها سامر · جهاز الكاشير · 10:24 ص' },
{ debt: false, title: 'دفعة نقدية', meta: '12 أكتوبر · دفع أكثر من دينه', amount: 500, after: -250, who: 'سجّلها صاحب المتجر · هاتف المالك · 5:02 م' },
{ debt: true, title: 'دين', meta: '3 أكتوبر · مواد تنظيف', amount: 250, after: 250, who: 'سجّلها سامر · جهاز الكاشير · 11:15 ص' },
{ head: 'سبتمبر 2026' },
{ debt: false, title: 'دفعة بنكية', meta: '28 سبتمبر', amount: 400, after: 0, who: 'سجّلها صاحب المتجر · هاتف المالك · 1:30 م' },
{ debt: true, title: 'دين', meta: '9 سبتمبر · مشتريات الشهر', amount: 400, after: 400, who: 'سجّلها سامر · جهاز الكاشير · 9:05 ص' },
];
const locked = this.props.paymentsLocked ?? false;
const menu = [
{ label: 'تذكير على واتساب', icon: 'M4 20l1.4-4.2A8 8 0 1 1 8.6 19zM9 10h6M9 13.5h4', color: 'var(--text)' },
{ label: 'مشاركة الكشف PDF', icon: 'M12 3v12M7 8l5-5 5 5M5 14v6h14v-6', color: 'var(--text)' },
{ label: 'تعديل البيانات', icon: 'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4', color: 'var(--text)' },
{ label: 'أرشفة', icon: 'M3 7h18v4H3zM5 11v9h14v-9M10 15h4', color: 'var(--owes)' },
];
return {
vars: this.theme(this.props.dark ?? false),
p: { ...p, debtHref: supplier ? 'QuickAddSupplier.dc.html' : 'QuickAddAmount.dc.html', payHref: supplier ? 'QuickAddSupplier.dc.html' : 'QuickAddOverpay.dc.html', word: w[0], color: w[1], arrow: w[2], amountText: p.bal === 0 ? '' : '₪ ' + this.fmt(p.bal) },
menuOpen: this.state.menu,
menuBtnBg: this.state.menu ? 'var(--surface)' : 'transparent',
toggleMenu: () => this.setState({ menu: !this.state.menu }),
menu: menu,
payOpen: !locked,
payLocked: locked,
items: raw.map((r, i) => {
if (r.head) return { isHead: true, isRow: false, label: r.head };
const aw = this.balWord(r.after);
const open = this.state.open === i;
return {
isHead: false, isRow: true, open,
title: r.title, meta: r.meta, who: r.who,
amount: this.fmt(r.amount),
amountColor: r.debt ? 'var(--owes)' : 'var(--link)',
icon: r.debt ? PLUS : DOWN,
iconBg: r.debt ? 'var(--owesSoft)' : 'var(--soft)',
iconFg: r.debt ? 'var(--owes)' : 'var(--link)',
after: aw[0], afterColor: aw[1],
fix: r.debt ? 'تصحيح المبلغ' : 'عكس الدفعة',
toggle: () => this.setState({ open: open ? -1 : i }),
};
}),
};
}
}
</script>
</body>
</html>
