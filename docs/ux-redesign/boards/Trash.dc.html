<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سلة المحذوفات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, #F5F8F3, #EDF6EF); font-family: 'Noto Sans Arabic', Roboto, system-ui, sans-serif; color: #142C24; overflow: hidden">

<header style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 4px">
<a href="Store.dc.html" aria-label="رجوع إلى المتجر" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #142C24">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
<h1 style="margin: 0; font-size: 21px; line-height: 30px; font-weight: 700">سلة المحذوفات</h1>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 0 18px 24px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0 0 6px; font-size: 14px; line-height: 21px; color: #5B6F63">الأشخاص المؤرشفون يبقى سجلهم كاملًا. الاستعادة تعيدهم كما كانوا.</p>
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<div style="border-radius: 13px; padding: 14px; background: #FFFFFF; border: 1px solid #D5E5D9; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #E7F3ED; color: #5B6F63; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{it.initials}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; line-height: 22px; font-weight: 700">{{it.name}}</span>
<span style="font-size: 12px; line-height: 18px; color: #5B6F63">{{it.kind}} · {{it.when}}</span>
</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{it.restore}}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #064B42; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">استعادة</button>
<button type="button" onClick="{{it.ask}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #AB323A; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">حذف نهائي</button>
</div>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 12px; text-align: center; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 17px; font-weight: 700">السلة فارغة</span>
<span style="font-size: 14px; line-height: 21px; color: #5B6F63">ما تؤرشفه من أشخاص أو إشعارات يظهر هنا.</span>
</div>
</sc-if>
</main>

<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; right: 18px; left: 18px; bottom: 24px; box-sizing: border-box; padding: 12px 14px; border-radius: 13px; background: #142C24; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 14px">{{toast}}<a href="Contact.dc.html" style="color: #78DEC0; font-weight: 700; text-decoration: none; min-height: 32px; display: flex; align-items: center">فتح السجل</a></div>
</sc-if>

<sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(20, 44, 36, 0.45); display: flex; align-items: flex-end">
<div role="alertdialog" aria-labelledby="trash-confirm" style="width: 100%; box-sizing: border-box; padding: 24px 20px 28px; border-radius: 26px 26px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<h2 id="trash-confirm" style="margin: 0; font-size: 21px; line-height: 30px; font-weight: 700">حذف {{askName}} نهائيًا؟</h2>
<p style="margin: 0; font-size: 15px; line-height: 24px; color: #5B6F63">لن يمكن استعادته بعد ذلك، ويختفي من الكشوفات القادمة.</p>
<button type="button" onClick="{{confirmDelete}}" style="height: 52px; border: 0; border-radius: 13px; background: #AB323A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">حذف نهائي</button>
<button type="button" onClick="{{cancel}}" style="height: 48px; border: 0; border-radius: 13px; background: #E7F3ED; color: #064B42; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">إلغاء</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { gone: {}, asking: null, toast: '' };
}
renderVals() {
const s = this.state;
const all = [
{ id: 'a', name: 'وليد عمر', initials: 'وع', kind: 'زبون وسجله · كان مسددًا', when: 'أُرشف قبل 4 أيام' },
{ id: 'b', name: 'تذكير: استحقاق مريم حسن', initials: 'تذ', kind: 'إشعار', when: 'حُذف أمس' },
];
const left = all.filter((x) => !s.gone[x.id]);
const asked = all.find((x) => x.id === s.asking);
return {
items: left.map((x) => ({
...x,
restore: () => this.setState({ gone: { ...s.gone, [x.id]: true }, toast: 'تمت استعادة ' + x.name }),
ask: () => this.setState({ asking: x.id }),
})),
empty: left.length === 0,
toast: s.toast,
asking: !!asked,
askName: asked ? asked.name : '',
confirmDelete: () => this.setState({ gone: { ...s.gone, [s.asking]: true }, asking: null, toast: '' }),
cancel: () => this.setState({ asking: null }),
};
}
}
</script>
</body>
</html>
