<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بانتظار موافقة الجهاز</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 18px 28px; display: flex; flex-direction: column; gap: 18px; background: linear-gradient(180deg, #F5F8F3, #EDF6EF); font-family: 'Noto Sans Arabic', Roboto, system-ui, sans-serif; color: #142C24; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700; color: #5B6F63">الخطوة 2 من 2 · أول دخول</span>
<h1 style="margin: 0; font-size: 23px; line-height: 32px; font-weight: 700">{{title}}</h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #5B6F63">{{subtitle}}</p>
</div>

<ol aria-label="مراحل تفعيل الجهاز" style="margin: 0; padding: 18px; list-style: none; border-radius: 18px; background: #FFFFFF; border: 1px solid #D5E5D9; display: flex; flex-direction: column; gap: 0">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<li style="display: flex; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; background: {{st.bg}}; border: 2px solid {{st.border}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{st.done}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></sc-if>
</span>
<sc-if value="{{st.line}}" hint-placeholder-val="{{ true }}"><span style="width: 2px; height: 28px; background: #D5E5D9"></span></sc-if>
</div>
<div style="padding-top: 3px; padding-bottom: 12px; display: flex; flex-direction: column">
<span style="font-size: 15px; line-height: 22px; font-weight: 700; color: {{st.ink}}">{{st.label}}</span>
<span style="font-size: 12px; line-height: 18px; color: #5B6F63">{{st.sub}}</span>
</div>
</li>
</sc-for>
</ol>

<sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ap-staff" style="font-size: 13px; font-weight: 700">من يستخدم هذا الجهاز؟</label>
<input id="ap-staff" value="سامر" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 13px; border: 1px solid #D5E5D9; background: #FFFFFF; font: inherit; font-size: 15px; color: #142C24">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ap-device" style="font-size: 13px; font-weight: 700">اسم الجهاز</label>
<input id="ap-device" value="جهاز الكاشير" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 13px; border: 1px solid #D5E5D9; background: #FFFFFF; font: inherit; font-size: 15px; color: #142C24">
</div>
<p style="margin: 0; font-size: 12px; line-height: 18px; color: #5B6F63">يظهر هذا الاسم لصاحب المتجر عند الموافقة، وبجانب كل حركة تسجلها.</p>
</div>
<div role="status" style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<span style="text-align: center; font-size: 13px; color: #5B6F63">نتحقق تلقائيًا كل 30 ثانية · آخر تحقق قبل 12 ث</span>
<button type="button" onClick="{{check}}" style="height: 52px; border: 0; border-radius: 13px; background: #064B42; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">تحقق الآن</button>
<a href="https://wa.me/" style="min-height: 44px; display: flex; align-items: center; justify-content: center; color: #064B42; font-size: 14px; font-weight: 700">اطلب الموافقة من صاحب المتجر</a>
</div>
</sc-if>

<sc-if value="{{approved}}" hint-placeholder-val="{{ false }}">
<a href="Home.dc.html" style="margin-top: auto; height: 56px; border-radius: 13px; background: #064B42; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">ابدأ العمل</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { approved: false };
}
renderVals() {
const ok = this.state.approved;
const step = (label, sub, done, current, line) => ({
label, sub, done, line,
bg: done ? '#064B42' : '#FFFFFF',
border: done ? '#064B42' : (current ? '#9A5A13' : '#D5E5D9'),
ink: done || current ? '#142C24' : '#5B6F63',
});
return {
title: ok ? 'تمت الموافقة على الجهاز' : 'بانتظار موافقة صاحب المتجر',
subtitle: ok ? 'يمكنك الآن التسجيل من هذا الجهاز.' : 'لحماية الدفتر، يعمل كل جهاز جديد بعد أن يوافق عليه صاحب المتجر.',
steps: [
step('دخلت إلى حساب المتجر', 'متجري', true, false, true),
step('سُجّل هذا الجهاز', 'مفتاح أمان خاص بالجهاز، لا يغادره', true, false, true),
step('موافقة صاحب المتجر', ok ? 'تمت الموافقة' : 'بانتظار الموافقة من لوحة الإدارة', ok, !ok, false),
],
waiting: !ok,
approved: ok,
check: () => this.setState({ approved: true }),
};
}
}
</script>
</body>
</html>
